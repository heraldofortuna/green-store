name: Fritz catalog check

on:
  schedule:
    - cron: '0 14 * * *' # ~09:00 PET (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fritz-catalog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fritz PDFs (no import)
        run: npm run catalog:check-fritz -- --write-state
      - name: Guardar estado de catálogos
        run: |
          git add scripts/fritz-catalog-state.json
          if git diff --cached --quiet; then
            echo "Sin cambios de estado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: actualizar estado de catálogos Fritz"
          git push
