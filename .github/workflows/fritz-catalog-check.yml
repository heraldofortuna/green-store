name: Fritz catalog check

on:
  schedule:
    - cron: '0 14 * * *' # ~09:00 PET (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fritz PDFs (no import)
        run: npm run catalog:check-fritz -- --write-state